# Smoke: the app boots, a dev account signs in, and every destination renders.
#
# This is the flow that catches the "it bundles but the screen is blank" class
# of regression — a broken provider in the root layout, a screen that throws on
# mount, an api-client that cannot resolve its base URL. It deliberately asserts
# on copy the user sees rather than on test ids, so the flow cannot pass while
# the UI is empty.
#
# The four main destinations (Dashboard, Activity, Reports, Budgets) live in a
# floating bottom nav bar and are reached by tapping their tab; Settings stays in
# the slide-out drawer, reached by swiping the drawer open from the edge.
# The bottom-nav tabs carry no copy, so the flow finds them by their test id;
# everything else is tapped by the label the user reads.
#
# Prerequisites (see .maestro/README.md): a booted emulator or device with the
# dev client installed, EXPO_PUBLIC_API_URL pointing at a reachable server, and
# ENABLE_DEV_AUTH=true on that server for the dev-account button.
appId: com.pluto.app
---
- launchApp:
    clearState: true

# Signed out on a clean install, so the way in is the first thing rendered.
- assertVisible: "Track spending in any currency, converted to your base."
- tapOn: "Continue with a dev account"

# Each destination must mount and paint its own heading; a single failing screen
# fails the flow at the step that reaches it.
- assertVisible: "Dashboard"
- assertVisible: "This month"

- tapOn: { id: "bottom-nav-activity" }
- assertVisible: "Activity"

- tapOn: { id: "bottom-nav-reports" }
- assertVisible: "Reports"

- tapOn: { id: "bottom-nav-budgets" }
- assertVisible: "Budgets"

- swipe:
    fromX: 0%
    fromY: 50%
    toX: 30%
    toY: 50%
- tapOn: "Settings"
- assertVisible: "Your account and preferences."
- assertVisible: "Sign out"
