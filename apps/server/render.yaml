###############################################################################
# Render Blueprint -- pluto-server
#
# Docs: https://render.com/docs/blueprint-spec
#
# This Blueprint defines TWO environments as two independent services:
#
#   pluto-server           -> production
#   pluto-server-staging   -> staging / pre-production
#
# They deliberately share no secrets and no database. Each service sets its own
# DATABASE_URL, JWT_ACCESS_SECRET, CORS_ORIGIN and OAuth audience in the Render
# dashboard (the `sync: false` keys below), so staging can never read or write
# production's data or tokens. Point them at different Neon branches -- see
# `docs/ENVIRONMENTS.md` at the repository root for the branch workflow.
#
# This is an npm-workspaces monorepo, so the service builds from the REPO ROOT
# (no rootDir) using the native Node runtime. `npm run <script> -w pluto-server`
# runs each workspace script with the workspace as its working directory, so the
# Prisma schema and lockfile are always resolved correctly.
#
# Why the commands look like this:
#   * Free web services do NOT support pre-deploy commands, so
#     `prisma migrate deploy` is folded into the start command instead.
#   * The build command must install its own dependencies; Render does not run
#     an implicit `npm install` when a build command is provided.
#
# Set the Blueprint Path to `apps/server/render.yaml` when creating the
# Blueprint in the Render dashboard -- this file is not at the repo root.
#
# Promoting a change:
#   * `pluto-server-staging` deploys the `staging` branch. Merge `main` into
#     `staging` to soak a build there before it reaches users.
#   * `pluto-server` deploys `main`. Merge `staging` into `main` once staging
#     looks right.
#   * To make production wait for CI as well, set `autoDeployTrigger: checksPass`
#     on the `pluto-server` service so it only deploys once checks are green.
###############################################################################

# Non-secret configuration shared by every environment. Secrets deliberately
# live on each service below (`sync: false`) so staging cannot inherit them.
envVarGroups:
  - name: pluto-server-config
    envVars:
      # -- Server -----------------------------------------------------------
      - key: NODE_ENV
        value: production

      # Pin the runtime; the repo requires Node >= 20.19.
      - key: NODE_VERSION
        value: "24"

      # Render injects PORT automatically -- do NOT set it here.
      - key: API_PREFIX
        value: v1

      - key: TRUST_PROXY
        value: "true"

      # -- Auth / JWT -------------------------------------------------------
      - key: ACCESS_TOKEN_TTL
        value: 15m

      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"

      # -- Rate limiting ----------------------------------------------------
      - key: THROTTLE_TTL
        value: "60"

      - key: THROTTLE_LIMIT
        value: "100"

      # -- Exchange rates ---------------------------------------------------
      - key: EXCHANGE_RATE_PROVIDER
        value: frankfurter

      - key: EXCHANGE_RATE_BASE_URL
        value: https://api.frankfurter.dev/v2

      - key: EXCHANGE_RATE_BASE_CURRENCY
        value: USD

      - key: EXCHANGE_RATE_CANONICAL_BASE
        value: USD

      - key: EXCHANGE_RATE_SCHEDULE
        value: "0 4 * * *"

      # -- Object storage ---------------------------------------------------
      # Starts DISABLED: no credit card required, and the API boots with every
      # feature except /v1/backups/* (which returns 503 instead of failing with
      # storage errors). To turn backups on for free:
      #   1. Create an account + bucket at Filebase (free 5 GB, no credit card).
      #   2. Set OBJECT_STORAGE_BUCKET to that bucket name.
      #   3. Paste the Filebase access key + secret.
      #   4. Set OBJECT_STORAGE_ENABLED to "true".
      # The bucket must exist already -- the application never creates it.
      # Enable storage per environment by overriding these on the service (use a
      # distinct bucket per environment so staging never writes production data).
      - key: OBJECT_STORAGE_ENABLED
        value: "false"

      - key: OBJECT_STORAGE_ENDPOINT
        value: https://s3.filebase.io

      - key: OBJECT_STORAGE_REGION
        value: auto

      - key: OBJECT_STORAGE_BUCKET
        value: pluto-backups

      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        value: unconfigured

      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        value: unconfigured

      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "true"

      # -- Backup quotas ----------------------------------------------------
      - key: BACKUP_MAX_SIZE_BYTES
        value: "52428800"

      - key: BACKUP_RETENTION_COUNT
        value: "5"

      - key: BACKUP_UPLOAD_URL_TTL
        value: "900"

      - key: BACKUP_DOWNLOAD_URL_TTL
        value: "900"

      - key: BACKUP_PENDING_EXPIRY_HOURS
        value: "24"

services:
  # --------------------------------------------------------------------------
  # Production
  # --------------------------------------------------------------------------
  - type: web
    name: pluto-server
    runtime: node
    plan: free
    region: oregon # Change to the region closest to your database / users.

    buildCommand: >-
      npm ci --include=dev &&
      npm run prisma:generate -w pluto-server &&
      npm run build -w pluto-server

    # Free plan has no pre-deploy hook: migrate, then boot. Migrations are
    # idempotent and the free plan runs a single instance, so this is safe.
    startCommand: >-
      npm run prisma:migrate:deploy -w pluto-server &&
      node apps/server/dist/apps/server/src/main.js

    # Render waits for a 2xx here before routing traffic. Readiness probes
    # Postgres (503 when unreachable) without the restart-on-outage semantics
    # a liveness probe would have. It only probes Postgres, so it is
    # unaffected by storage being disabled.
    healthCheckPath: /v1/health/ready

    envVars:
      - fromGroup: pluto-server-config

      # -- Production secrets (set these in the Render dashboard) -----------
      # Comma-separated explicit origins (e.g. https://pluto.example). The
      # server refuses to boot in production while this is a wildcard.
      - key: CORS_ORIGIN
        sync: false

      # Prefer a card-free external Postgres (e.g. Neon): free Render Postgres
      # databases are deleted 30 days after creation. Use the *production*
      # Neon branch here.
      - key: DATABASE_URL
        sync: false

      # Must be at least 32 characters; the server refuses to boot otherwise.
      - key: JWT_ACCESS_SECRET
        sync: false

      # At least one non-empty client ID is required in production.
      - key: GOOGLE_ALLOWED_CLIENT_IDS
        sync: false

      - key: ADMIN_EMAILS
        sync: false

  # --------------------------------------------------------------------------
  # Staging / pre-production
  # --------------------------------------------------------------------------
  - type: web
    name: pluto-server-staging
    runtime: node
    plan: free
    region: oregon # Keep identical to pluto-server.
    # Deploy the pre-production branch, not `main`. Merge `main` -> `staging`
    # to soak a build here; merge `staging` -> `main` to promote it.
    branch: staging

    buildCommand: >-
      npm ci --include=dev &&
      npm run prisma:generate -w pluto-server &&
      npm run build -w pluto-server

    startCommand: >-
      npm run prisma:migrate:deploy -w pluto-server &&
      node apps/server/dist/apps/server/src/main.js

    healthCheckPath: /v1/health/ready

    envVars:
      - fromGroup: pluto-server-config

      # -- Staging secrets (set these in the Render dashboard) --------------
      # The staging clients' origins, e.g.
      # https://staging.pluto.example,http://localhost:3001
      - key: CORS_ORIGIN
        sync: false

      # A *separate* Neon branch (e.g. `staging`) -- never production's URL.
      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      # The staging OAuth audience; use a client ID that production does not.
      - key: GOOGLE_ALLOWED_CLIENT_IDS
        sync: false

      - key: ADMIN_EMAILS
        sync: false
