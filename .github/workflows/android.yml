# Builds and tests the native Android app that lives in apps/mobile.
#
# Required repository secret:
#   GOOGLE_SERVICES_JSON        — the Pluto Firebase project's app/google-services.json
#                               (public client config, but tied to our package and SHA-1).
#
# Release secrets:
#   PLUTO_RELEASE_KEYSTORE_B64  — base64 of the upload/release keystore.
#   PLUTO_RELEASE_STORE_PASSWORD, PLUTO_RELEASE_KEY_ALIAS,
#   PLUTO_RELEASE_KEY_PASSWORD  — the keystore credentials.
#   GOOGLE_SERVICE_ACCOUNT_KEY  — only for the optional Play upload: JSON key of a
#                               service account with Release manager access.
#
# The Kotlin sources use JDK 21 and compileSdk/targetSdk 36. The two Firestore
# emulator tests are deliberately separate from the hermetic JVM unit tests.

name: Android

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Upload the release APK to Google Play
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, emulator tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19

      # v4 dropped the retired `tools` package, accepts the SDK licenses and
      # puts sdkmanager on PATH. v3 fails because Google no longer serves it.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set. Copy your Pluto Firebase project's google-services.json into the repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/app/google-services.json

      - name: JVM unit tests
        working-directory: apps/mobile
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon

      # npx runs the emulator from the app directory so firebase.json and
      # firestore.rules resolve. Gradle tests hardcode the same 8085/9099 ports.
      - name: Firestore/Auth emulator tests
        working-directory: apps/mobile
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --only firestore,auth --project demo-no-project --config firebase.json \
            'bash ./gradlew :app:testEmulator --no-daemon'

      - name: Build debug APK
        working-directory: apps/mobile
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Report the signing fingerprint from the APK
        id: fingerprint
        run: |
          apk=$(ls apps/mobile/app/build/outputs/apk/debug/*.apk | head -n 1)
          package=$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' apps/mobile/app/build.gradle.kts | head -n 1)
          if [ -z "$apk" ] || [ -z "$package" ]; then
            echo "::error::Could not find the debug APK or applicationId."
            exit 1
          fi
          digest=$(node scripts/apk-fingerprint.mjs "$apk" --sha1)
          sha1=$(printf '%s' "$digest" | tr -d '[:space:]:' | tr 'A-Z' 'a-z' | sed 's/\(..\)/\1:/g; s/:$//' | tr 'a-z' 'A-Z')
          echo "PLUTO_ANDROID_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "PLUTO_ANDROID_SHA1=$sha1" >> "$GITHUB_ENV"
          echo "PLUTO_ANDROID_PACKAGE=$package"
          echo "PLUTO_ANDROID_SHA1=$sha1"
          echo "::notice title=Android OAuth fingerprint::package=$package sha1=$sha1"
          {
            echo "## Android OAuth registration"
            echo ""
            echo "Register this pair on the **Android** OAuth client in Google Cloud Console:"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package name | \`$package\` |"
            echo "| SHA-1 | \`$sha1\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pluto-android-debug
          path: apps/mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release APK
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # v4 dropped the retired `tools` package, accepts the SDK licenses and
      # puts sdkmanager on PATH. v3 fails because Google no longer serves it.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/app/google-services.json

      - name: Restore release keystore
        env:
          PLUTO_RELEASE_KEYSTORE_B64: ${{ secrets.PLUTO_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$PLUTO_RELEASE_KEYSTORE_B64" ]; then
            echo "::error::PLUTO_RELEASE_KEYSTORE_B64 is not set."
            exit 1
          fi
          printf '%s' "$PLUTO_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pluto-release.jks"
          chmod 600 "$RUNNER_TEMP/pluto-release.jks"

      - name: Build signed release APK
        working-directory: apps/mobile
        env:
          PLUTO_RELEASE_STORE_FILE: ${{ runner.temp }}/pluto-release.jks
          PLUTO_RELEASE_STORE_PASSWORD: ${{ secrets.PLUTO_RELEASE_STORE_PASSWORD }}
          PLUTO_RELEASE_KEY_ALIAS: ${{ secrets.PLUTO_RELEASE_KEY_ALIAS }}
          PLUTO_RELEASE_KEY_PASSWORD: ${{ secrets.PLUTO_RELEASE_KEY_PASSWORD }}
        run: |
          for name in PLUTO_RELEASE_STORE_PASSWORD PLUTO_RELEASE_KEY_ALIAS PLUTO_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set."
              exit 1
            fi
          done
          bash ./gradlew :app:assembleRelease --no-daemon

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: pluto-android-release
          path: apps/mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload to Google Play
        if: ${{ inputs.submit }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          packageName: com.pluto.app
          releaseFiles: apps/mobile/app/build/outputs/apk/release/*.apk
          track: production
          status: draft
