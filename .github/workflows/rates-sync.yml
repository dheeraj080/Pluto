# Daily exchange-rate sync: fetch from a free API and write directly to Neon.
#
# Runs every day at 05:00 UTC. Fetches rates from Frankfurter (no API key,
# no quotas) and inserts them into the Neon database via Prisma — no running
# server instance and no HTTP endpoint required.
#
# Required repository secrets and variables:
#   DATABASE_URL  (secret) — Neon pooled connection string, e.g.
#                            postgresql://user:pass@host.neon.tech/db?sslmode=require
#   EXCHANGE_RATE_BASE_CURRENCY  (variable, optional) — defaults to USD

name: Rates sync

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rates-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync rates to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repo's pinned npm
        run: npm install --global npm@11.16.0 && npm --version

      - name: Install the monorepo
        run: npm ci

      - name: Generate the Prisma client
        run: npm run prisma:generate --workspace pluto-server

      - name: Sync rates to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXCHANGE_RATE_BASE_CURRENCY: ${{ vars.EXCHANGE_RATE_BASE_CURRENCY || 'USD' }}
        working-directory: apps/server
        run: npx ts-node scripts/sync-rates-to-neon.ts
