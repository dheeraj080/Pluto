# Builds the Android development client and reports its signing fingerprint.
#
# Runs on GitHub's own runner instead of EAS: the Ubuntu image ships the Android
# SDK and a JDK, so no Expo account and no EXPO_TOKEN are needed anywhere. The
# point of the job is the *fingerprint* — Google Cloud Console requires the
# package name plus the signing certificate's SHA-1 before it will accept
# com.pluto.app on the Android OAuth client, and that SHA-1 does not exist
# until a signing key does.
#
# Signing key: GitHub's runners are ephemeral, so without a pinned key each run
# signs with a throwaway one and its SHA-1 changes every time. Set the
# ANDROID_DEBUG_KEYSTORE_B64 repository secret (a base64 of a debug.keystore —
# alias `androiddebugkey`, storepass/keypass `android`) and the fingerprint is
# stable across runs. Generate one with:
#
#   keytool -genkeypair -v -keystore debug.keystore -storetype JKS \
#     -storepass android -keypass android -alias androiddebugkey \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -dname "CN=Android Debug,O=Android,C=US"
#   base64 -w0 debug.keystore        # that string is the secret value
#
# This is a *debug* key: right for dev clients, never for a release build.

name: Android dev client

on:
  workflow_dispatch:
  # A push that touches the mobile app rebuilds the dev client, so an installable
  # APK is always current. The repo is public, so Actions minutes cost nothing.
  # Narrow or drop this if it ever gets noisy.
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-dev-client.yml'

permissions:
  contents: read

concurrency:
  group: android-dev-client
  cancel-in-progress: true

jobs:
  build:
    name: Build dev client, report SHA-1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: package-lock.json

      # package.json pins npm@11.16.0, but Node 20.19 ships npm 10.8. Installing
      # with a different npm than the one that wrote the lockfile is exactly how
      # an install succeeds locally and fails in CI.
      - name: Use the repo's pinned npm
        run: npm install --global npm@11.16.0 && npm --version

      # React Native 0.86 / Expo SDK 57 build against JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The whole monorepo, because apps/web and apps/mobile resolve the
      # workspace package @pluto/api-client through hoisting.
      - name: Install the monorepo
        run: |
          set -o pipefail
          if npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"; then
            exit 0
          fi
          # The Actions log endpoint needs authentication, but check-run
          # annotations on a public repo do not. Re-emit the failure newest-line
          # first so the real error survives the 10-annotation cap.
          tail -n 15 "$RUNNER_TEMP/npm-ci.log" | tac | while IFS= read -r line; do
            echo "::error::${line//'%'/'%25'}"
          done
          exit 1

      - name: Upload the install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-log
          path: ${{ runner.temp }}/npm-ci.log
          if-no-files-found: ignore

      - name: Restore a stable Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Restored the pinned signing key."
          else
            # No keystore: Gradle creates a debug one on first use. Not an error,
            # but the fingerprint will differ on the next run.
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set, so this run signs with a throwaway key — the SHA-1 below will not match the next run."
          fi

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Prebuild has just regenerated android/, so the pinned key is copied in
      # afterwards — before it, the copy would be thrown away. It goes to both
      # places Gradle might look: the template's explicit `android/app`
      # signingConfigs.debug storeFile, and Gradle's default ~/.android location.
      - name: Pin the signing key where Gradle looks
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p apps/mobile/android/app
            cp "$HOME/.android/debug.keystore" apps/mobile/android/app/debug.keystore
            echo "Pinned the restored key as android/app/debug.keystore."
          else
            echo "No pinned key, so Gradle generates its own debug keystore."
          fi

      - name: Build the dev client APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # The fingerprint must come from the APK, not from the keystore file we
      # hoped Gradle would use: those are only the same thing if the generated
      # template's debug signingConfig actually points at android/app. Reading
      # the artifact makes the run self-checking, and a build that quietly
      # signed with some other key fails here instead of on a phone as
      # DEVELOPER_ERROR (status 10) — the symptom that costs the most time,
      # because it looks like a Console problem.
      - name: Verify and report the signing fingerprint
        id: fingerprint
        working-directory: apps/mobile
        run: |
          package=$(sed -n "s/^\s*package: '\([^']*\)'.*/\1/p" app.config.ts | head -n 1)
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)

          if [ -z "$package" ] || [ -z "$apk" ]; then
            echo "::error::Could not find the inputs (package='$package', apk='$apk')."
            exit 1
          fi

          # Read the signature off the artifact itself, never off the keystore we
          # hoped Gradle used — only then does the mismatch check below prove
          # anything. scripts/apk-fingerprint.mjs parses the v2/v3 signing block
          # directly, so it needs no Android SDK (this job installs none) and does
          # not hinge on another tool's output format. The previous reader shelled
          # out to apksigner, whose format is not guaranteed, and came back empty
          # on a genuinely signed APK — a false alarm on a check that must not lie.
          reader_log=$(mktemp)
          apk_sha1=''
          if raw=$(node scripts/apk-fingerprint.mjs "$apk" --sha1 2>"$reader_log"); then
            apk_sha1=$(printf '%s' "$raw" | tr -d '[:space:]:' | tr 'A-Z' 'a-z')
          fi

          # What we asked Gradle to sign with: the template's android/app
          # storeFile when present, otherwise the ~/.android default. Both sides
          # are normalized the same way — colonless, lowercase — because keytool
          # and the APK reader emit colons in different places, and comparing two
          # spellings of one fingerprint would fail a build that is fine.
          keystore="android/app/debug.keystore"
          [ -f "$keystore" ] || keystore="$HOME/.android/debug.keystore"
          key_sha1=$(keytool -list -v -keystore "$keystore" \
            -alias androiddebugkey -storepass android -keypass android 2>/dev/null \
            | sed -n 's/^\s*SHA1: //p' | tr -d '[:space:]:' | tr 'A-Z' 'a-z')

          if [ -z "$apk_sha1" ]; then
            # Never report a fingerprint that did not come off the artifact: that
            # is how a run goes green while the phone still says DEVELOPER_ERROR.
            # The reader's own message goes out as annotations too, because the
            # Actions log endpoint needs authentication but annotations do not.
            echo "::error::Could not read a signing certificate from '$apk'."
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::apk reader: ${line//'%'/'%25'}"
            done < "$reader_log"
            exit 1
          fi

          if [ -n "$key_sha1" ] && [ "$apk_sha1" != "$key_sha1" ]; then
            echo "::error::The APK is NOT signed with the pinned keystore, so the Console entry cannot match. apk=$apk_sha1 pinned=$key_sha1"
            exit 1
          fi

          # It came off the artifact, and it matches the key we pinned (or the
          # keystore could not be read, leaving nothing to compare against).
          source=apk
          digest=$apk_sha1

          # Report it the way Google Cloud Console wants it typed in.
          sha1=$(printf '%s' "$digest" | tr 'a-z' 'A-Z' | sed 's/\(..\)/\1:/g; s/:$//')

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "sha1=$sha1" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          # Also to the log itself: step outputs and the job summary are not
          # readable from the run's log, so this is the only line that lets the
          # fingerprint be read back out of CI without downloading anything.
          echo "PLUTO_ANDROID_PACKAGE=$package"
          echo "PLUTO_ANDROID_SHA1=$sha1"
          echo "PLUTO_ANDROID_SHA1_SOURCE=$source"
          echo "PLUTO_ANDROID_KEYSTORE=$keystore"
          # The log endpoint needs authentication and the job summary is not in
          # the run page's HTML, but check-run annotations are readable on a
          # public repo. An annotation is therefore the only way to read the
          # fingerprint back out of CI without credentials.
          echo "::notice title=Android OAuth fingerprint::package=$package sha1=$sha1 source=$source"
          {
            echo "## Android OAuth registration"
            echo ""
            echo "Paste both onto the **Android** OAuth client in Google Cloud Console"
            echo "(APIs & Services → Credentials → the client whose type is *Android*):"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package name | \`$package\` |"
            echo "| SHA-1 | \`$sha1\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: pluto-android-dev-client
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
